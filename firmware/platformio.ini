; M5Stack StopWatch — Claude Desktop Assistant
; ESP32-S3R8 with 1.75" round AMOLED, MEMS mic, ES8311 audio codec
;
; If your device isn't recognized, try changing `board` to:
;   m5stack-dial         (M5Stack Dial)
;   m5stack-stamps3      (M5StampS3)
;   esp32s3box           (generic ESP32-S3 box)

[env:m5stack-stopwatch]
platform = espressif32
board = esp32s3box
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_size = 16MB
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=0
    -DLV_CONF_SKIP=1

lib_deps =
    m5stack/M5Unified @ ^0.2.0
    links2004/WebSockets @ ^2.4.0
    bblanchon/ArduinoJson @ ^7.0.0

upload_port = COM7
monitor_port = COM7
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
